# Example: build multi-arch container images on the ARM runner.
# Native arm64 builds are fast; amd64 runs under QEMU emulation (the VM has
# qemu-user-static registered by cloud-init) and is ~5-10x slower - build it,
# but keep heavy amd64 jobs rare to stay quick.
name: Docker multi-arch

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: [self-hosted, oracle-a1]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # no-op on this VM, kept for portability
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host         # faster pulls through the host net

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (arm64 native + amd64 emulated)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # GitHub-hosted build cache - keeps the 100 GB VM disk lean
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
