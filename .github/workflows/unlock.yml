name: Unlock state (maintenance)

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: "Lock ID expected in the lock object (leave blank = auto-detect; direct delete also works)"
        default: ""

permissions:
  contents: read

concurrency:
  group: oci-provision-tf
  cancel-in-progress: false

jobs:
  unlock:
    name: release stale terraform state lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
      OCI_CLI_AUTH: api_key
      TF_STATE_BUCKET: oci-provision-tfstate
      TF_STATE_KEY: oci-provision.tfstate
    steps:
      - name: Preflight - required secrets
        run: |
          miss=0
          check() { [ -n "$2" ] || { echo "::error title=Missing secret::$1 is not set - see docs/CI_DEPLOYMENT.md"; miss=1; }; }
          check OCI_TENANCY_OCID "$OCI_CLI_TENANCY"
          check OCI_USER_OCID "$OCI_CLI_USER"
          check OCI_FINGERPRINT "$OCI_CLI_FINGERPRINT"
          check OCI_PRIVATE_KEY "$OCI_CLI_KEY_CONTENT"
          check OCI_REGION "$OCI_CLI_REGION"
          [ "$miss" = 0 ] || exit 1

      - name: Install OCI CLI
        run: |
          python3 -m pip install --user --quiet oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # NOTE: deliberately NO terraform init in this workflow. Empirically,
      # right after a terraform init the lock object 404s on GET/HEAD (while
      # object list still sees it) - an OCI Object Storage quirk that made
      # earlier versions of this workflow believe there was nothing to
      # unlock. Pure oci CLI calls with no prior terraform read the lock
      # reliably.

      - name: Read the lock object (auto-detect ID)
        id: lock
        run: |
          set -euo pipefail
          LOCK_OBJ="${TF_STATE_KEY:-oci-provision.tfstate}.lock"

          LOCK_JSON="$(oci os object get --bucket-name "$TF_STATE_BUCKET" --name "$LOCK_OBJ" --file - 2>/tmp/lock_err || true)"
          if [ -n "$LOCK_JSON" ]; then
            echo "--- current lock object content ---"
            printf '%s\n' "$LOCK_JSON"
            LOCK_ID="$(printf '%s' "$LOCK_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("ID",""))' 2>/dev/null || true)"
            echo "id=$LOCK_ID" >> "$GITHUB_OUTPUT"
            echo "detected lock ID: $LOCK_ID"
            if [ -n "${{ inputs.lock_id }}" ] && [ "$LOCK_ID" != "${{ inputs.lock_id }}" ]; then
              echo "::error::lock object ID ($LOCK_ID) does not match the lock_id input (${{ inputs.lock_id }}) - refusing to delete"
              exit 2
            fi
            exit 0
          fi

          echo "--- object get failed (full stderr) ---"
          head -30 /tmp/lock_err || true
          N="$(oci os object list --bucket-name "$TF_STATE_BUCKET" --prefix "$LOCK_OBJ" --query 'length(data)' --raw-output 2>/dev/null || echo 0)"
          if [ "$N" = "1" ]; then
            echo "exists_unreadable=true" >> "$GITHUB_OUTPUT"
            echo "::warning::lock object EXISTS (per object list) but its content could not be read - deleting it directly (only run this when no terraform is active; the concurrency group serializes our own runs)"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "no lock object '$LOCK_OBJ' found (nothing to unlock)"
          fi

      - name: Delete the lock object directly
        if: ${{ steps.lock.outputs.id != '' || steps.lock.outputs.exists_unreadable == 'true' }}
        run: |
          set -euo pipefail
          LOCK_OBJ="${TF_STATE_KEY:-oci-provision.tfstate}.lock"
          # Direct delete == what terraform force-unlock does internally
          # (removes the lock object; on the versioned bucket this adds a
          # delete marker, and the next conditional PUT succeeds).
          oci os object delete --bucket-name "$TF_STATE_BUCKET" --name "$LOCK_OBJ"
          echo "lock object deleted"

      - name: Verify lock released (authoritative object list)
        run: |
          set -euo pipefail
          LOCK_OBJ="${TF_STATE_KEY:-oci-provision.tfstate}.lock"
          N="$(oci os object list --bucket-name "$TF_STATE_BUCKET" --prefix "$LOCK_OBJ" --query 'length(data)' --raw-output 2>/dev/null || echo 0)"
          if [ "$N" = "0" ]; then
            echo "lock object gone - state is writable again"
          else
            echo "::error::lock object still listed - run the forensics workflow (oci os object list-object-versions) to inspect"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## State lock release"
            echo ""
            echo "- Lock ID: \`${{ steps.lock.outputs.id }}\` (deleted directly from Object Storage)"
            echo "- Stale locks happen when a run is cancelled mid-apply; safe to re-run anytime."
          } >> "$GITHUB_STEP_SUMMARY"
