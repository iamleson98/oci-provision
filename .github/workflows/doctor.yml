name: Doctor (health check)

on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Also run a docker prune on the A1 worker"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: oci-provision-tf
  cancel-in-progress: false

jobs:
  doctor:
    name: health check the A1 worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16.0"
          terraform_wrapper: false

      - name: Preflight - required secrets
        run: |
          miss=0
          check() { [ -n "$2" ] || { echo "::error title=Missing secret::$1 is not set - see docs/CI_DEPLOYMENT.md"; miss=1; }; }
          check OCI_TENANCY_OCID "${{ secrets.OCI_TENANCY_OCID }}"
          check OCI_USER_OCID "${{ secrets.OCI_USER_OCID }}"
          check OCI_FINGERPRINT "${{ secrets.OCI_FINGERPRINT }}"
          check OCI_PRIVATE_KEY "${{ secrets.OCI_PRIVATE_KEY }}"
          check OCI_REGION "${{ secrets.OCI_REGION }}"
          check OCI_NAMESPACE "${{ secrets.OCI_NAMESPACE }}"
          [ "$miss" = 0 ] || exit 1

      - name: Terraform init (state - IPs + generated SSH key)
        run: bash scripts/tf_init.sh

      - name: Resolve SSH key + IP
        run: |
          A1_IP="$(terraform -ch-dir=terraform output -raw a1_public_ip)"
          {
            echo "A1_IP=$A1_IP"
            if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
              echo "SSH_PRIVATE_KEY<<KEYEOF"
              terraform -ch-dir=terraform output -raw ssh_private_key_pem
              echo "KEYEOF"
            fi
          } >> "$GITHUB_ENV"

      - name: Run doctor.sh on the VM
        run: |
          KEYFILE="$(mktemp)"; chmod 600 "$KEYFILE"
          printf '%s\n' "${SSH_PRIVATE_KEY//\\n/$'\n'}" > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          ssh -i "$KEYFILE" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@$A1_IP" 'bash /opt/oci-runner/scripts/doctor.sh' 2>&1 | tee doctor.log

      - name: Optional docker prune
        if: ${{ inputs.prune == true }}
        run: |
          KEYFILE="$(mktemp)"; chmod 600 "$KEYFILE"
          printf '%s\n' "${SSH_PRIVATE_KEY//\\n/$'\n'}" > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          ssh -i "$KEYFILE" -o StrictHostKeyChecking=accept-new "ubuntu@$A1_IP" \
            'docker system prune -af --filter "label!=oci-runner.keep" && docker volume prune -f && docker builder prune -af'

      - name: Summary
        if: always()
        run: |
          {
            echo "## Doctor @ $A1_IP"
            echo '```'
            cat doctor.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
