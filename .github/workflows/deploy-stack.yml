name: Deploy stack (no infra changes)

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: "owner/repo[,owner/repo2] the runners serve (blank = this repo)"
        default: ""
      min_runners:
        description: "Minimum warm runners (blank = 1)"
        default: ""
      max_runners:
        description: "Max runner containers (blank = profile default: 2 always-on / 4 burst)"
        default: ""
      runner_memory_gb:
        description: "Per-runner memory cap in GB (blank = 5)"
        default: ""

permissions:
  contents: read

concurrency:
  group: oci-provision-tf
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + install runner stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      RUNNER_GITHUB_PAT: ${{ secrets.RUNNER_GITHUB_PAT }}
      GITHUB_REPOSITORIES: ${{ inputs.repositories || github.repository }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      WAKER_STATUS_TOKEN: ${{ secrets.WAKER_STATUS_TOKEN }}
      MIN_RUNNERS: ${{ inputs.min_runners }}
      MAX_RUNNERS: ${{ inputs.max_runners }}
      RUNNER_MEMORY_GB: ${{ inputs.runner_memory_gb }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.16.0"
          terraform_wrapper: false

      - name: Preflight - required secrets
        run: |
          miss=0
          check() { [ -n "$2" ] || { echo "::error title=Missing secret::$1 is not set - see docs/CI_DEPLOYMENT.md"; miss=1; }; }
          check OCI_TENANCY_OCID "$OCI_TENANCY_OCID"
          check OCI_USER_OCID "$OCI_USER_OCID"
          check OCI_FINGERPRINT "$OCI_FINGERPRINT"
          check OCI_PRIVATE_KEY "$OCI_PRIVATE_KEY"
          check OCI_REGION "$OCI_REGION"
          check OCI_NAMESPACE "$OCI_NAMESPACE"
          check RUNNER_GITHUB_PAT "$RUNNER_GITHUB_PAT"
          [ "$miss" = 0 ] || exit 1

      - name: Terraform init (state - IPs + generated SSH key)
        run: bash scripts/tf_init.sh

      - name: Read terraform outputs
        run: |
          {
            echo "A1_IP=$(terraform -chdir=terraform output -raw a1_public_ip)"
            echo "WAKER_IP=$(terraform -chdir=terraform output -raw waker_public_ip)"
            echo "A1_INSTANCE_ID=$(terraform -chdir=terraform output -raw a1_instance_id)"
          } >> "$GITHUB_ENV"

      - name: Deploy (profile auto-detected from the VM)
        run: bash scripts/ci_deploy.sh

      - name: Summary
        run: |
          {
            echo "## Runner stack redeployed"
            echo "- Repos: \`$GITHUB_REPOSITORIES\` (label \`oracle-a1\`)"
            echo "- A1 worker: \`$A1_IP\`"
            echo "- Knobs: min=${MIN_RUNNERS:-auto} max=${MAX_RUNNERS:-auto} mem=${RUNNER_MEMORY_GB:-5}GB"
          } >> "$GITHUB_STEP_SUMMARY"
